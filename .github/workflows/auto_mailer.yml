name: Project AV Automated Mailer

on:
  schedule:
    # Runs every 15 minutes between 8 AM and 10 PM AST (Puerto Rico time)
    - cron: '*/15 12-23,0-2 * * *'
  workflow_dispatch:
    # Allows you to click a button to test it manually

jobs:
  run-mailer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread pandas google-auth

      - name: Run Mailer Script
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
        run: python mailer.py
